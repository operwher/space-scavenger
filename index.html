<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Space Scavenger 0.6</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#dffcff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#102039,#02040a 72%)}
.card{padding:30px 24px;text-align:center;border:1px solid #42f6ff;border-radius:18px;background:#07111eea;box-shadow:0 0 35px #00eaff55}
h1{margin:0 0 8px;letter-spacing:3px;font-size:32px}
p{opacity:.7}
button{-webkit-tap-highlight-color:transparent;user-select:none;font:inherit}
#startBtn{margin-top:20px;padding:16px 28px;border:1px solid #4ff;border-radius:12px;background:#0b2630;color:#dffcff;font-weight:700}
#startBtn.pressed,#startBtn:active{background:#1de9ff;color:#001014;box-shadow:0 0 25px #1de9ff}
#hud{position:fixed;z-index:4;top:12px;left:14px;font-size:14px;line-height:1.55;text-shadow:0 0 8px #0ff}
#hint{position:fixed;z-index:4;top:12px;right:14px;text-align:right;font-size:12px;opacity:.6}
#controls{position:fixed;z-index:10;inset:0;pointer-events:none}
.pad{position:absolute;left:18px;bottom:20px;width:156px;height:156px}
.k{position:absolute;width:50px;height:50px;border:1px solid #64faffaa;border-radius:14px;background:#102431e8;color:#dff;font-size:20px;pointer-events:auto;box-shadow:0 0 8px #0ff2}
.k.active{background:#16e7ff;color:#001014;border-color:#fff;box-shadow:0 0 25px #16e7ff;transform:scale(.94)}
.up{left:53px;top:0}.left{left:0;top:53px}.right{right:0;top:53px}.down{left:53px;bottom:0}
.arm{position:absolute;bottom:28px;width:82px;height:82px;border-radius:50%;border:1px solid #64faffaa;background:#102431e8;color:#dff;font-weight:700;pointer-events:auto}
.arm.active{background:#ff2bd6;color:#fff;border-color:#fff;box-shadow:0 0 25px #ff2bd6;transform:scale(.94)}
#l{right:116px}#r{right:20px}
#msg{position:fixed;z-index:5;left:50%;bottom:125px;transform:translateX(-50%);padding:8px 13px;border:1px solid #54faff88;border-radius:10px;background:#06131de8;opacity:0;transition:.12s;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start">
  <div class="card">
    <h1>SPACE SCAVENGER</h1>
    <p>ORBITAL CLEANUP // SHIFT 01</p>
    <button id="startBtn">START SHIFT</button>
  </div>
</div>

<div id="hud"></div>
<div id="hint">PC: WASD / ARROWS<br>Mobile: D-pad + L/R ARM</div>
<div id="msg"></div>

<div id="controls">
  <div class="pad">
    <button class="k up" data-key="up">▲</button>
    <button class="k left" data-key="left">◀</button>
    <button class="k right" data-key="right">▶</button>
    <button class="k down" data-key="down">▼</button>
  </div>
  <button class="arm" id="l">L ARM</button>
  <button class="arm" id="r">R ARM</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const startBtn=document.getElementById('startBtn');
const hud=document.getElementById('hud');
const msg=document.getElementById('msg');

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let running=false, credits=0, cargo=0, capacity=8;
const keys=new Set();

const player={x:0,y:0,speed:280};
const camera={x:0,y:0};
let junk=[], stars=[];
let armFlash={left:0,right:0};

function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeStars();
}
addEventListener('resize',resize);

function makeStars(){
  stars=[];
  for(let i=0;i<180;i++){
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      depth:.2+Math.random()*.8,r:.5+Math.random()*1.3
    });
  }
}

const types=[
 {name:'SCRAP METAL',value:20,color:'#aeb8c4',r:12},
 {name:'CANNED FOOD',value:12,color:'#e8ad52',r:10},
 {name:'BATTERY',value:35,color:'#50ff9a',r:11},
 {name:'OLD ENGINE',value:70,color:'#c7d1dc',r:17},
 {name:'CIGARETTE BUTT',value:5,color:'#dedede',r:6},
 {name:'UNKNOWN ALLOY',value:120,color:'#d85cff',r:14}
];

function spawnJunk(){
  junk=[];
  for(let i=0;i<45;i++){
    const a=Math.random()*Math.PI*2;
    const d=180+Math.random()*1800;
    const t=types[Math.floor(Math.random()*types.length)];
    junk.push({
      x:Math.cos(a)*d,
      y:Math.sin(a)*d,
      ...t,
      taken:false,
      rot:Math.random()*Math.PI*2
    });
  }
}

function begin(){
  running=true;
  start.style.display='none';
  credits=0; cargo=0;
  player.x=0; player.y=0;
  // IMPORTANT: camera is exactly the mech position.
  camera.x=player.x;
  camera.y=player.y;
  spawnJunk();
  notice('SHIFT STARTED');
}

function notice(t){
  msg.textContent=t; msg.style.opacity='1';
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>msg.style.opacity='0',700);
}

function bindHold(button,key){
  const down=e=>{
    e.preventDefault();
    keys.add(key);
    button.classList.add('active');
  };
  const up=e=>{
    e.preventDefault();
    keys.delete(key);
    button.classList.remove('active');
  };
  button.addEventListener('pointerdown',down);
  button.addEventListener('pointerup',up);
  button.addEventListener('pointercancel',up);
  button.addEventListener('pointerleave',up);
}
document.querySelectorAll('.k').forEach(b=>bindHold(b,b.dataset.key));

function grab(side,button){
  if(!running)return;
  button.classList.add('active');
  setTimeout(()=>button.classList.remove('active'),140);
  if(cargo>=capacity){notice('CARGO FULL');return;}

  let target=null,best=170;
  for(const j of junk){
    if(j.taken)continue;
    const d=Math.hypot(j.x-player.x,j.y-player.y);
    if(d<best){best=d;target=j;}
  }
  armFlash[side]=.18;

  if(!target){
    notice('NO TARGET IN RANGE');
    return;
  }
  target.taken=true;
  cargo++;
  credits+=target.value;
  notice(target.name+'  +$'+target.value);
}

function bindArm(button,side){
  button.addEventListener('pointerdown',e=>{
    e.preventDefault();
    grab(side,button);
  });
}
bindArm(document.getElementById('l'),'left');
bindArm(document.getElementById('r'),'right');

startBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  startBtn.classList.add('pressed');
  begin();
});
startBtn.addEventListener('pointerup',()=>startBtn.classList.remove('pressed'));

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys.add(k);
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

// World movement ------------------------------------------------------------
// The mech NEVER moves on screen.
// Player coordinates move in the world.
// Camera is hard-locked to player coordinates.
// Therefore all junk/space scenery scrolls across the screen.
function update(dt){
  let dx=0,dy=0;
  if(keys.has('d')||keys.has('arrowright')||keys.has('right'))dx+=1;
  if(keys.has('a')||keys.has('arrowleft')||keys.has('left'))dx-=1;
  if(keys.has('s')||keys.has('arrowdown')||keys.has('down'))dy+=1;
  if(keys.has('w')||keys.has('arrowup')||keys.has('up'))dy-=1;

  const len=Math.hypot(dx,dy);
  if(len>0){
    player.x+=(dx/len)*player.speed*dt;
    player.y+=(dy/len)*player.speed*dt;
  }

  // NO smoothing. Exact camera lock.
  camera.x=player.x;
  camera.y=player.y;

  armFlash.left=Math.max(0,armFlash.left-dt);
  armFlash.right=Math.max(0,armFlash.right-dt);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#02040a';
  ctx.fillRect(0,0,W,H);

  // Star field moves opposite to player direction.
  for(const s of stars){
    const sx=((s.x - camera.x*s.depth*.018)%W+W)%W;
    const sy=((s.y - camera.y*s.depth*.018)%H+H)%H;
    ctx.globalAlpha=.2+.65*s.depth;
    ctx.fillStyle=s.depth>.72?'#c8ffff':'#52788a';
    ctx.beginPath();
    ctx.arc(sx,sy,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // World grid, also scrolls with the camera.
  const grid=120;
  const ox=((W/2-camera.x)%grid+grid)%grid;
  const oy=((H/2-camera.y)%grid+grid)%grid;
  ctx.strokeStyle='#0a2532';
  ctx.lineWidth=1;
  for(let x=ox;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Junk uses world coordinates -> screen coordinates.
  for(const j of junk){
    if(j.taken)continue;
    const sx=W/2+(j.x-camera.x);
    const sy=H/2+(j.y-camera.y);
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;

    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(j.rot);
    ctx.fillStyle=j.color;
    ctx.strokeStyle='#dffcff';
    ctx.lineWidth=1;
    ctx.shadowBlur=12;
    ctx.shadowColor=j.color;

    if(j.name==='CIGARETTE BUTT'){
      ctx.fillRect(-j.r,-3,j.r*2,6);
    }else if(j.name==='OLD ENGINE'){
      ctx.beginPath();ctx.arc(0,0,j.r,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#26394b';
      ctx.beginPath();ctx.arc(0,0,j.r*.42,0,Math.PI*2);ctx.fill();
    }else{
      ctx.beginPath();
      ctx.rect(-j.r,-j.r*.7,j.r*2,j.r*1.4);
      ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }

  drawMech();
}

function drawMech(){
  const cx=W/2,cy=H/2;

  ctx.save();
  ctx.translate(cx,cy);

  // Arms point forward. Later these become physical grappling arms.
  drawArm(-1,armFlash.left);
  drawArm(1,armFlash.right);

  ctx.shadowBlur=20;
  ctx.shadowColor='#2df5ff';
  ctx.fillStyle='#172a3c';
  ctx.strokeStyle='#55faff';
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.roundRect(-24,-32,48,64,11);
  ctx.fill();ctx.stroke();

  ctx.fillStyle='#9fffff';
  ctx.fillRect(-11,-18,22,10);
  ctx.fillStyle='#263d52';
  ctx.fillRect(-16,2,32,17);
  ctx.fillStyle='#55faff';
  ctx.fillRect(-5,23,10,7);

  ctx.shadowBlur=0;
  ctx.restore();
}

function drawArm(side,flash){
  const color=flash>0?'#ff2bd6':'#51f7ff';
  const sx=side*20,sy=side*7;
  const tx=side*78,ty=-8;

  ctx.strokeStyle=color;
  ctx.shadowBlur=flash>0?22:10;
  ctx.shadowColor=color;
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(side*48,-2);
  ctx.lineTo(tx,ty);
  ctx.stroke();

  ctx.fillStyle=flash>0?'#ff2bd6':'#183a48';
  ctx.strokeStyle='#dffcff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(tx,ty,9,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
}

let last=0;
function loop(t){
  if(!last)last=t;
  const dt=Math.min(.033,(t-last)/1000);
  last=t;
  if(running){
    update(dt);
    draw();
    hud.innerHTML=
      `CREDITS: $${credits} &nbsp; CARGO: ${cargo}/${capacity}<br>`+
      `MECH POS: ${Math.round(player.x)}, ${Math.round(player.y)}<br>`+
      `CAMERA: LOCKED TO MECH`;
  }
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
