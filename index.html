<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Space Scavenger Prototype 0.8</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#dff;touch-action:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%;background:#050713}
  #hud{position:fixed;left:14px;top:12px;z-index:5;pointer-events:none;font-size:13px;line-height:1.45;text-shadow:0 0 8px #000}
  #hud b{font-size:15px}
  #hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;pointer-events:none;opacity:.75;font-size:11px;text-align:center}
  .ctrl{position:fixed;z-index:10;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #joy{left:20px;bottom:22px;width:126px;height:126px;border:2px solid rgba(120,255,255,.38);border-radius:50%;background:rgba(20,35,55,.28);box-shadow:0 0 24px rgba(80,255,255,.08) inset}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(100,245,255,.55);border:2px solid rgba(190,255,255,.8);box-shadow:0 0 18px rgba(100,245,255,.45)}
  .arm{bottom:42px;width:94px;height:58px;border-radius:15px;border:2px solid rgba(255,120,210,.45);background:rgba(50,20,55,.48);color:#ffd8f5;font-weight:800;letter-spacing:.5px}
  .arm.active{background:rgba(255,70,190,.7);border-color:#fff;box-shadow:0 0 24px rgba(255,70,190,.65);transform:scale(.96)}
  .arm.cool{opacity:.45}
  #leftArm{right:124px} #rightArm{right:18px}
  #status{position:fixed;right:14px;top:12px;z-index:5;text-align:right;font-size:12px;line-height:1.5;pointer-events:none}
  #start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#101a2c 0,#050713 65%);text-align:center}
  #startBox{padding:30px 26px;border:1px solid rgba(100,245,255,.28);border-radius:22px;background:rgba(7,12,25,.82);box-shadow:0 0 50px rgba(80,220,255,.12)}
  #start h1{margin:0 0 8px;font-size:28px;letter-spacing:2px}
  #start p{margin:0 0 22px;opacity:.7;font-size:12px}
  #startBtn{border:2px solid #7ffcff;background:rgba(60,220,255,.16);color:#dff;font-weight:900;border-radius:14px;padding:14px 28px;font-size:16px;touch-action:manipulation}
  #startBtn:active{background:rgba(60,220,255,.6);color:#001015}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <b>SPACE SCAVENGER</b><br>
  CARGO <span id="cargo">0</span>/12 · ¢ <span id="credits">0</span><br>
  SPEED <span id="speed">0.0</span> · MAX <span id="max">2.2</span>
</div>
<div id="hint">조이스틱으로 360° 이동 · 방향을 급하게 바꾸면 자동 감속</div>
<div id="status">
  L <span id="lcd">READY</span><br>
  R <span id="rcd">READY</span>
</div>

<div id="joy" class="ctrl"><div id="knob"></div></div>
<button id="leftArm" class="ctrl arm">L ARM</button>
<button id="rightArm" class="ctrl arm">R ARM</button>

<div id="start">
  <div id="startBox">
    <h1>SPACE SCAVENGER</h1>
    <p>ORBITAL CLEANUP SHIFT · PROTOTYPE 0.8</p>
    <button id="startBtn">START SHIFT</button>
  </div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const cargoEl=document.getElementById('cargo'), creditsEl=document.getElementById('credits');
const speedEl=document.getElementById('speed'), maxEl=document.getElementById('max');
const lcd=document.getElementById('lcd'),rcd=document.getElementById('rcd');
const leftBtn=document.getElementById('leftArm'),rightBtn=document.getElementById('rightArm');

let started=false, last=performance.now(), cargo=0, credits=0;
const world={x:0,y:0};
const mech={x:0,y:0,heading:0,vx:0,vy:0};
const BASE_MAX=2.2; // intentionally low: upgrade room later
const ACCEL=1.35, DRAG=.38, TURN_RATE=2.8;
const junk=[];
for(let i=0;i<42;i++){
  junk.push({x:(Math.random()-.5)*1700,y:(Math.random()-.5)*1100,
    r:7+Math.random()*8, a:Math.random()*6.28, spin:(Math.random()-.5)*.25,
    fx:Math.random()*6.28, fy:Math.random()*6.28, type:i%6});
}
const stars=[];
for(let i=0;i<150;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*1.5});

const joy={active:false,id:null,x:0,y:0};
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
function setJoy(clientX,clientY){
  const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy,max=39, d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joy.x=dx/max;joy.y=dy/max;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function clearJoy(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)';}
joyEl.addEventListener('touchstart',e=>{e.preventDefault();joy.active=true;joy.id=e.changedTouches[0].identifier;let t=e.changedTouches[0];setJoy(t.clientX,t.clientY)},{passive:false});
joyEl.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id)setJoy(t.clientX,t.clientY)},{passive:false});
joyEl.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id)clearJoy()},{passive:false});
joyEl.addEventListener('touchcancel',clearJoy,{passive:true});

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function inputVector(){
  let x=joy.x,y=joy.y;
  if(keys.a||keys.arrowleft)x-=1;
  if(keys.d||keys.arrowright)x+=1;
  if(keys.w||keys.arrowup)y-=1;
  if(keys.s||keys.arrowdown)y+=1;
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m}
  return {x,y,m:Math.min(1,m)};
}

function angleDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}

function updateMech(dt){
  const iv=inputVector();
  if(iv.m>.08){
    const desired=Math.atan2(iv.y,iv.x);
    const diff=angleDiff(desired,mech.heading);
    // Stronger braking for sharper turns. 180° reversal = maximum braking.
    const severity=Math.min(1,Math.abs(diff)/Math.PI);
    const braking=1 + severity*4.5;
    const brakeFactor=Math.max(0,1-braking*dt);
    mech.vx*=brakeFactor; mech.vy*=brakeFactor;
    const turn=Math.sign(diff)*Math.min(Math.abs(diff),TURN_RATE*dt*(.45+.55*iv.m));
    mech.heading+=turn;
    mech.vx+=Math.cos(mech.heading)*ACCEL*iv.m*dt;
    mech.vy+=Math.sin(mech.heading)*ACCEL*iv.m*dt;
  } else {
    mech.vx*=Math.max(0,1-DRAG*dt);
    mech.vy*=Math.max(0,1-DRAG*dt);
  }
  const sp=Math.hypot(mech.vx,mech.vy);
  if(sp>BASE_MAX){const k=BASE_MAX/sp;mech.vx*=k;mech.vy*=k}
  mech.x+=mech.vx*60*dt; mech.y+=mech.vy*60*dt;
}

const grapples={
  L:{cool:0,success:false,state:'ready',x:0,y:0,tx:0,ty:0,dist:0,target:null},
  R:{cool:0,success:false,state:'ready',x:0,y:0,tx:0,ty:0,dist:0,target:null}
};
const GRAPPLE_SPEED=520, RANGE=420;
function armScreenButton(side){
  return side==='L'?leftBtn:rightBtn;
}
function updateArmUI(side){
  const g=grapples[side],btn=armScreenButton(side),el=side==='L'?lcd:rcd;
  if(g.cool>0){btn.classList.add('cool');el.textContent=g.cool.toFixed(1)+'s'}
  else {btn.classList.remove('cool');el.textContent=g.state==='ready'?'READY':g.state.toUpperCase()}
}
function pressArm(side){
  const g=grapples[side];
  if(!started || g.cool>0 || g.state==='out'||g.state==='return')return;
  const btn=armScreenButton(side);
  btn.classList.add('active'); setTimeout(()=>btn.classList.remove('active'),140);
  g.state='out';g.target=null;
  const sx=mech.x,sy=mech.y;
  // Grapple fires exactly in the mech's facing direction. No auto-targeting.
  g.x=sx;g.y=sy;g.tx=sx+Math.cos(mech.heading)*RANGE;g.ty=sy+Math.sin(mech.heading)*RANGE;
  g.dist=0;
}
function finishArm(side,success){
  const g=grapples[side];
  g.success=success; g.state='ready'; g.target=null;
  g.cool=success?2.0:5.0;
}
function updateGrapple(side,dt){
  const g=grapples[side];
  if(g.cool>0){g.cool=Math.max(0,g.cool-dt);if(g.cool===0)g.state='ready'}
  if(g.state==='ready')return;
  const dx=g.tx-g.x,dy=g.ty-g.y,d=Math.hypot(dx,dy),step=GRAPPLE_SPEED*dt;
  if(g.state==='out'){
    if(d>step){g.x+=dx/d*step;g.y+=dy/d*step}
    else {
      g.x=g.tx;g.y=g.ty;
      // Collision is checked only at the grapple head; anything along the line can be hooked.
      let hit=null,best=34;
      for(const j of junk){
        const dd=Math.hypot(j.x-g.x,j.y-g.y);
        if(dd<best){best=dd;hit=j}
      }
      if(hit){
        g.target=hit; g.state='return'; g.tx=mech.x;g.ty=mech.y;
      } else {
        g.state='return';g.tx=mech.x;g.ty=mech.y;
        g.failPending=true;
      }
    }
  } else if(g.state==='return'){
    g.tx=mech.x;g.ty=mech.y;
    const dx2=g.tx-g.x,dy2=g.ty-g.y,d2=Math.hypot(dx2,dy2);
    if(d2>step){g.x+=dx2/d2*step;g.y+=dy2/d2*step;
      if(g.target){g.target.x=g.x;g.target.y=g.y}
    } else {
      if(g.target){
        const idx=junk.indexOf(g.target); if(idx>=0)junk.splice(idx,1);
        cargo=Math.min(12,cargo+1);credits+=g.target?.value||10;
        finishArm(side,true);
      } else finishArm(side,false);
    }
  }
}
function spawnMore(){
  while(junk.length<42){
    junk.push({x:mech.x+(Math.random()-.5)*1600,y:mech.y+(Math.random()-.5)*1100,
      r:7+Math.random()*8,a:Math.random()*6.28,spin:(Math.random()-.5)*.25,fx:Math.random()*6.28,fy:Math.random()*6.28,type:Math.floor(Math.random()*6)});
  }
}

function updateJunk(dt,t){
  for(const j of junk){
    j.a+=j.spin*dt;
    j.x+=Math.sin(t*.00055+j.fx)*0.18*dt*60;
    j.y+=Math.cos(t*.00048+j.fy)*0.16*dt*60;
  }
}

function drawBackground(){
  ctx.fillStyle='#050713';ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=.25+s.s/4;
    ctx.fillStyle='#b9d9ff';ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  const spacing=100, ox=(( -mech.x)%spacing+spacing)%spacing, oy=((-mech.y)%spacing+spacing)%spacing;
  ctx.strokeStyle='rgba(80,150,190,.09)';ctx.lineWidth=1;
  for(let x=ox;x<W;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=oy;y<H;y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function sx(wx){return W/2+(wx-mech.x)}
function sy(wy){return H/2+(wy-mech.y)}

function drawJunk(){
  for(const j of junk){
    const x=sx(j.x),y=sy(j.y);
    if(x<-40||x>W+40||y<-40||y>H+40)continue;
    ctx.save();ctx.translate(x,y);ctx.rotate(j.a);
    ctx.shadowBlur=12;ctx.shadowColor='rgba(100,240,255,.35)';
    ctx.strokeStyle='rgba(130,230,255,.8)';ctx.fillStyle='rgba(25,70,90,.85)';ctx.lineWidth=2;
    const r=j.r;
    if(j.type%3===0){ctx.fillRect(-r,-r*.65,r*2,r*1.3);ctx.strokeRect(-r,-r*.65,r*2,r*1.3)}
    else if(j.type%3===1){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke()}
    else{ctx.beginPath();ctx.moveTo(-r,-r);ctx.lineTo(r,-r*.4);ctx.lineTo(r*.5,r);ctx.lineTo(-r*.6,r*.6);ctx.closePath();ctx.fill();ctx.stroke()}
    ctx.restore();
  }
}
function drawGrapple(side){
  const g=grapples[side]; if(g.state==='ready')return;
  const x1=sx(mech.x),y1=sy(mech.y),x2=sx(g.x),y2=sy(g.y);
  ctx.save();ctx.strokeStyle=side==='L'?'#ff79d8':'#d7a0ff';ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor=ctx.strokeStyle;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x2,y2,6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawMech(){
  const cx=W/2,cy=H/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(mech.heading);
  ctx.shadowBlur=28;ctx.shadowColor='rgba(100,240,255,.35)';
  ctx.fillStyle='#182a39';ctx.strokeStyle='#9dfcff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-15);ctx.lineTo(-18,-9);ctx.lineTo(-16,9);ctx.lineTo(-10,15);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#dffcff';ctx.fillRect(-5,-7,12,14);
  ctx.fillStyle='#ff5ec7';ctx.fillRect(5,-4,4,8);
  ctx.restore();
}
function draw(){
  drawBackground();drawJunk();drawGrapple('L');drawGrapple('R');drawMech();
  speedEl.textContent=Math.hypot(mech.vx,mech.vy).toFixed(1);maxEl.textContent=BASE_MAX.toFixed(1);
  cargoEl.textContent=cargo;creditsEl.textContent=credits;
  updateArmUI('L');updateArmUI('R');
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(started){
    updateMech(dt);updateGrapple('L',dt);updateGrapple('R',dt);updateJunk(dt,t);spawnMore();draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function bindArm(btn,side){
  btn.addEventListener('touchstart',e=>{e.preventDefault();pressArm(side)},{passive:false});
  btn.addEventListener('mousedown',e=>{e.preventDefault();pressArm(side)});
}
bindArm(leftBtn,'L');bindArm(rightBtn,'R');

document.getElementById('startBtn').addEventListener('touchstart',e=>{e.preventDefault();started=true;document.getElementById('start').style.display='none'},{passive:false});
document.getElementById('startBtn').addEventListener('click',()=>{started=true;document.getElementById('start').style.display='none'});
document.getElementById('start').addEventListener('touchstart',e=>{if(e.target===document.getElementById('start')){started=true;document.getElementById('start').style.display='none'}},{passive:false});
</script>
</body>
</html>
